[project]
name = "rsec-sparql-mcp"
version = "0.1.0"
description = "FastMCP server exposing RSEC SPARQL queries to LLM agents"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.1.6",
    "httpx>=0.28.1",
    "rdflib>=7.6.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
