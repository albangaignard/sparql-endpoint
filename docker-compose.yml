services:
  download:
    image: curlimages/curl:latest
    platform: linux/arm64
    volumes:
      - ./data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "=== Downloading RDF files ==="
        cd /data

        download() {
          url="$$1"
          filename=$$(basename "$$url" | sed 's/?.*$$//')
          echo "  Downloading: $$filename"
          curl -L --fail --show-error -o "$$filename" "$$url"
        }

        BASE="https://raw.githubusercontent.com/research-software-ecosystem/content/refs/heads/master/datasets"

        download "$$BASE/bioschemas-dump.ttl"
        download "$$BASE/bioschemas-biii-dump.ttl"
        download "$$BASE/bioconda-dump.ttl"
        # download "$$BASE/bioconductor-dump.ttl"
        download "$$BASE/biocontainers-dump.ttl"
        download "$$BASE/debian-dump.ttl"
        download "$$BASE/galaxy-dump.ttl"
        download "$$BASE/galaxyworkflow-dump.ttl"
        download "$$BASE/workflowhub-dump.ttl"
        # Add more files here:
        # download "$$BASE/another-file.ttl"

        echo "=== Downloads complete ==="

  fuseki:
    image: stain/jena-fuseki:5.1.0
    platform: linux/amd64
    depends_on:
      download:
        condition: service_completed_successfully
    ports:
      - "3030:3030"
    volumes:
      - ./data:/staging:ro
      - fuseki-db:/fuseki
    environment:
      ADMIN_PASSWORD: "admin"
      FUSEKI_DATASET_1: "ds"
      TDB: "2"
      JVM_ARGS: "-Xmx4g"
    restart: unless-stopped

volumes:
  fuseki-db: